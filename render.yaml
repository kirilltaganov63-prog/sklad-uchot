services:
  - type: web
    name: складской-учет
    env: python
    plan: free
    buildCommand: ""
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: warehouse-db
          property: connectionString
  - type: psql
    name: warehouse-db
    plan: free
