{% extends "base.html" %}

{% block title %}Закупка - Складской учет{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-success">
            <div class="card-header bg-success bg-opacity-10 text-success">
                <i class="bi bi-truck me-2"></i>
                <strong>Закупка товаров</strong>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Товар *</label>
                        <select name="product_id" class="form-select" required>
                            <option value="">Выберите товар</option>
                            {% for p in products %}
                            <option value="{{ p.id }}">
                                {{ p.name }} - Закупка: {{ p.cost_price }} руб, в наличии: {{ p.quantity }} шт
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Количество *</label>
                        <input type="number" name="quantity" class="form-control" required min="1">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Поставщик</label>
                        <input type="text" name="counterparty" class="form-control" placeholder="Название компании">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">Оформить закупку</button>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
