{% extends "base.html" %}

{% block title %}Закупка - Складской учет{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-success">
            <div class="card-header bg-success bg-opacity-10 text-success">
                <i class="bi bi-truck me-2"></i>
                <strong>Закупка товаров (приход от поставщика)</strong>
            </div>
            <div class="card-body">
                <form method="post" action="{{ url_for('purchase') }}">
                    <div class="mb-3">
                        <label for="product_id" class="form-label">Товар *</label>
                        <select name="product_id" id="product_id" class="form-select" required>
                            <option value="">Выберите товар</option>
                            {% for p in products %}
                            <option value="{{ p.id }}">
                                {{ p.name }} 
                                {% if p.size %}({{ p.size }}){% endif %} 
                                - Закупка: {{ p.cost_price }} руб, 
                                в наличии: {{ p.quantity }} шт
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="quantity" class="form-label">Количество *</label>
                        <input type="number" name="quantity" id="quantity" class="form-control" required min="1" step="1">
                    </div>
                    
                    <div class="mb-4">
                        <label for="counterparty" class="form-label">Поставщик</label>
                        <input type="text" name="counterparty" id="counterparty" class="form-control" placeholder="Название компании или ИП">
                    </div>
                    
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle me-2"></i>
                        <strong>Информация:</strong> Сумма закупки = количество × закупочная цена
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg me-2"></i>Оформить закупку
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg me-2"></i>Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Подсказка: при выборе товара можно показывать цену
    const select = document.getElementById('product_id');
    const priceInfo = document.createElement('div');
    priceInfo.className = 'mt-2 small text-muted';
    select.parentNode.appendChild(priceInfo);
    
    select.addEventListener('change', function() {
        const selectedOption = select.options[select.selectedIndex];
        const text = selectedOption.text;
        const match = text.match(/Закупка: (\d+(?:\.\d+)?) руб/);
        if (match) {
            priceInfo.innerHTML = '<i class="bi bi-currency-ruble"></i> Цена закупки: ' + match[1] + ' руб/шт';
        } else {
            priceInfo.innerHTML = '';
        }
    });
</script>
{% endblock %}
